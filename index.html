<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Bradesco Pix Puro</title>
    <style>
        body { 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bloco-texto-topo {
            text-align: center;
            margin-bottom: 20px;
        }
        .topo-titulo { 
            font-size: 24px; 
            font-weight: 900; 
            color: #cc092f; 
            text-transform: uppercase; 
            margin: 0 0 4px 0;
        }
        .sub-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            margin: 0;
        }
        .campo-faturamento {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .campo-faturamento label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .campo-faturamento input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            color: #1e293b;
        }
        .campo-faturamento input:focus {
            border-color: #cc092f;
            outline: none;
        }
        .grupo-botoes {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-gerar {
            background-color: #cc092f;
            color: #ffffff;
        }
        .btn-gerar:hover {
            background-color: #a30724;
        }
        .btn-limpar {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-limpar:hover {
            background-color: #cbd5e1;
        }
        .area-qrcode {
            display: none;
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        
        /* 📜 TEXTO DE INSTRUÇÃO JOGADO PARA CIMA */
        .instrucao-topo-bloco {
            font-size: 12px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin: 10px auto 15px auto;
            max-width: 290px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        /* 🎯 QR CODE DE ESTRUTURA PURA COMO RODAPÉ */
        .bloco-virtual-qr {
            width: 220px;
            height: 220px;
            margin: 0 auto 15px auto;
            border: 2px solid #000000;
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
            padding: 10px;
        }
        .ancora {
            position: absolute;
            width: 45px;
            height: 45px;
            border: 12px solid #000000;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .ancora-tl { top: 15px; left: 15px; }
        .ancora-tr { top: 15px; right: 15px; }
        .ancora-bl { bottom: 15px; left: 15px; }
        
        .centro-sinal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            color: #cc092f;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bloco-texto-topo">
            <div class="topo-titulo">Bradesco Pix Oficial</div>
            <div class="sub-titulo">Mairiporã Agro — José Carlos Suguimoto</div>
        </div>
        
        <!-- Entrada de valores -->
        <div class="campo-faturamento">
            <label for="valorVenda">Valor do Faturamento (R$)</label>
            <input type="number" id="valorVenda" step="0.01" placeholder="0,00" min="0.01">
        </div>

        <!-- Botões de Bancada -->
        <div class="grupo-botoes">
            <button class="btn btn-limpar" onclick="limparMaquininha()">Limpar</button>
            <button class="btn btn-gerar" onclick="gerarPix()">Gerar Pix</button>
        </div>
        
        <!-- 🎯 ÁREA DE EXIBIÇÃO REORGANIZADA -->
        <div id="blocoQrCode" class="area-qrcode">
            
            <!-- 1️⃣ A instrução agora aparece primeiro, logo abaixo dos botões -->
            <div class="instrucao-topo-bloco">
                📢 Aponte a câmera do celular para pagar o faturamento de balcão com Taxa Zero e Juros Zero.
            </div>
            
            <!-- 2️⃣ O QR Code agora funciona como o elemento de rodapé -->
            <div class="bloco-virtual-qr">
                <div class="ancora ancora-tl"></div>
                <div class="ancora ancora-tr"></div>
                <div class="ancora ancora-bl"></div>
                <div class="centro-sinal">MAIRIPORÃ<br>AGRO<br><span style="color:#000; font-size:10px;">PIX DIRETO</span></div>
            </div>
            
            <!-- 3️⃣ Encerramento com a tarja de Liquidação BCB -->
            <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
            
        </div>
    </div>

    <script>
        function gerarPix() {
            var valor = document.getElementById('valorVenda').value;
            if (valor === "" || valor <= 0) {
                alert("Por favor, digite um valor válido para a venda!");
                return;
            }
            document.getElementById('blocoQrCode').style.display = 'block';
        }

        function limparMaquininha() {
            document.getElementById('valorVenda').value = "";
            document.getElementById('blocoQrCode').style.display = 'none';
        }
    </script>

</body>
</html>
