<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Bradesco Pix Puro</title>
    <!-- 🛠️ BIBLIOTECA INTERNA PARA DESENHAR O QR CODE VIA CÓDIGO PURO -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bloco-texto-topo {
            text-align: center;
            margin-bottom: 20px;
        }
        .topo-titulo { 
            font-size: 24px; 
            font-weight: 900; 
            color: #cc092f; 
            text-transform: uppercase; 
            margin: 0 0 4px 0;
        }
        .sub-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            margin: 0;
        }
        .campo-faturamento {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .campo-faturamento label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .campo-faturamento input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            color: #1e293b;
        }
        .campo-faturamento input:focus {
            border-color: #cc092f;
            outline: none;
        }
        .grupo-botoes {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-gerar {
            background-color: #cc092f;
            color: #ffffff;
        }
        .btn-gerar:hover {
            background-color: #a30724;
        }
        .btn-limpar {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-limpar:hover {
            background-color: #cbd5e1;
        }
        .area-qrcode {
            display: none;
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        /* 🎯 CONTAINER DO QUADRADO DO QR CODE */
        #qrcode { 
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto;
            width: 220px;
            height: 220px;
            border: 1px solid #e2e8f0;
            padding: 10px;
            background: #fff;
        }
        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 10px;
            text-align: center;
            display: inline-block;
        }
        .rodape-texto {
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bloco-texto-topo">
            <div class="topo-titulo">Bradesco Pix Oficial</div>
            <div class="sub-titulo">Mairiporã Agro — José Carlos Suguimoto</div>
        </div>
        
        <!-- Campo para digitar o valor da venda -->
        <div class="campo-faturamento">
            <label for="valorVenda">Valor do Faturamento (R$)</label>
            <input type="number" id="valorVenda" step="0.01" placeholder="0,00" min="0.01">
        </div>

        <!-- Botões de comando da bancada -->
        <div class="grupo-botoes">
            <button class="btn btn-limpar" onclick="limparMaquininha()">Limpar</button>
            <button class="btn btn-gerar" onclick="gerarPix()">Gerar Pix</button>
        </div>
        
        <!-- Área oculta que aparece após clicar em Gerar -->
        <div id="blocoQrCode" class="area-qrcode">
            
            <!-- O próprio sistema vai desenhar o QR Code aqui dentro -->
            <div id="qrcode"></div>
            
            <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
            
            <div class="rodape-texto">
                Aponte a câmera do celular para pagar o faturamento de balcão com Taxa Zero e Juros Zero.
            </div>
        </div>
    </div>

    <script>
        var qrcodeInstancia = null;

        function gerarPix() {
            var valor = document.getElementById('valorVenda').value;
            if (valor === "" || valor <= 0) {
                alert("Por favor, digite um valor válido para a venda!");
                return;
            }

            // Chave e-mail padrão para o Pix automático
            var chavePix = "josicarlossuguimoto@gmail.com";

            // Limpa o QR Code anterior se ele já existir
            document.getElementById('qrcode').innerHTML = "";

            // Desenha o QR Code novo na tela com precisão milimétrica
            qrcodeInstancia = new QRCode(document.getElementById("qrcode"), {
                text: chavePix,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Exibe a área na tela
            document.getElementById('blocoQrCode').style.display = 'block';
        }

        function limparMaquininha() {
            document.getElementById('valorVenda').value = "";
            document.getElementById('blocoQrCode').style.display = 'none';
            document.getElementById('qrcode').innerHTML = "";
        }
    </script>

</body>
</html>
