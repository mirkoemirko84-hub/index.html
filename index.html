<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Bradesco Pix Puro</title>
    <!-- 🛠️ MOTOR INDEPENDENTE DE DESENHO DO QR CODE -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bloco-texto-topo {
            text-align: center;
            margin-bottom: 20px;
        }
        .topo-titulo { 
            font-size: 24px; 
            font-weight: 900; 
            color: #cc092f; 
            text-transform: uppercase; 
            margin: 0 0 4px 0;
        }
        .sub-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            margin: 0;
        }
        .campo-faturamento {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .campo-faturamento label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .campo-faturamento input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            color: #1e293b;
        }
        .campo-faturamento input:focus {
            border-color: #cc092f;
            outline: none;
        }
        .grupo-botoes {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-gerar {
            background-color: #cc092f;
            color: #ffffff;
        }
        .btn-gerar:hover {
            background-color: #a30724;
        }
        .btn-limpar {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-limpar:hover {
            background-color: #cbd5e1;
        }
        .area-qrcode {
            display: none;
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        .instrucao-topo-bloco {
            font-size: 12px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin: 10px auto 15px auto;
            max-width: 290px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .bloco-qrcode-real {
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 10px;
            border: 1px solid #e2e8f0;
            width: 220px;
            height: 220px;
            box-sizing: border-box;
        }
        .bloco-qrcode-real img {
            width: 200px;
            height: 200px;
        }
        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bloco-texto-topo">
            <div class="topo-titulo">Bradesco Pix Oficial</div>
            <div class="sub-titulo">Mairiporã Agro — José Carlos Suguimoto</div>
        </div>
        
        <div class="campo-faturamento">
            <label for="valorVenda">Valor do Faturamento (R$)</label>
            <input type="number" id="valorVenda" step="0.01" placeholder="0,00" min="0.01">
        </div>

        <div class="grupo-botoes">
            <button class="btn btn-limpar" onclick="limparMaquininha()">Limpar</button>
            <button class="btn btn-gerar" onclick="gerarPix()">Gerar Pix</button>
        </div>
        
        <div id="blocoQrCode" class="area-qrcode">
            <div class="instrucao-topo-bloco">
                📢 Aponte a câmera do celular para pagar o faturamento de balcão com Taxa Zero e Juros Zero.
            </div>
            
            <!-- 🎯 ÁREA ONDE O SCRIPT VAI RECONSTRUIR O QR CODE OFICIAL BRASIL -->
            <div id="qrcodeSpace" class="bloco-qrcode-real"></div>
            
            <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
        </div>
    </div>

    <script>
        // Função auxiliar para calcular o CRC16 exigido pelo Banco Central
        function calcularCRC16(str) {
            var crc = 0xFFFF;
            for (var c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            var hex = (crc & 0xFFFF).toString(16).toUpperCase();
            return ("0000" + hex).slice(-4);
        }

        function gerarPix() {
            var inputValor = document.getElementById('valorVenda').value;
            if (inputValor === "" || inputValor <= 0) {
                alert("Por favor, digite um valor válido para a venda!");
                return;
            }

            // Formata o valor exatamente com duas casas decimais (ex: 1.98)
            var valorFormatado = parseFloat(inputValor).toFixed(2);

            // Montagem do payload oficial no padrão Pix Estático do Banco Central (EMV)
            var chave = "mirkoemirko84@gmail.com";
            var merchantName = "JOSE C SUGUIMOTO";
            var merchantCity = "MAIRIPORA";

            var payload = "00020126" + String(chave.length + 22).padStart(2, '0') + "0014br.gov.bcb.pix01" + String(chave.length).padStart(2, '0') + chave;
            payload += "52040000530398654" + String(valorFormatado.length).padStart(2, '0') + valorFormatado;
            payload += "5802BR59" + String(merchantName.length).padStart(2, '0') + merchantName + "60" + String(merchantCity.length).padStart(2, '0') + merchantCity + "62070503***6304";
            
            // Completa com o dígito verificador de segurança obrigatório
            var payloadCompleto = payload + calcularCRC16(payload);

            // Aciona o gerador para criar a imagem do QR Code dinâmico
            var qr = qrcode(0, 'M');
            qr.addData(payloadCompleto);
            qr.make();

            document.getElementById('qrcodeSpace').innerHTML = qr.createImgTag(5, 10);
            document.getElementById('blocoQrCode').style.display = 'block';
        }

        function limparMaquininha() {
            document.getElementById('valorVenda').value = "";
            document.getElementById('blocoQrCode').style.display = 'none';
            document.getElementById('qrcodeSpace').innerHTML = "";
        }
    </script>

</body>
</html>
