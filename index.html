        body {

            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;

            width: 100%;
            display: flex;

            margin-bottom: 20px;

            text-transform: uppercase; 
            margin: 0 0 4px 0;

        .sub-titulo {

            text-transform: uppercase;

        .campo-faturamento {

        }
        .campo-faturamento label {

            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .campo-faturamento input {

            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 6px;

            text-align: center;
            color: #1e293b;
        }
        .campo-faturamento input:focus {
            border-color: #cc092f;

        }
        .grupo-botoes {

            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-gerar {
            background-color: #cc092f;
            color: #ffffff;
        }
        .btn-gerar:hover {
            background-color: #a30724;
        }
        .btn-limpar {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-limpar:hover {
            background-color: #cbd5e1;
        }
        .area-qrcode {
            display: none;
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        .instrucao-topo-bloco {
            font-size: 12px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin: 10px auto 15px auto;
            max-width: 290px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .bloco-qrcode-real {
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 10px;
            border: 1px solid #e2e8f0;
            width: 220px;
            height: 220px;
            box-sizing: border-box;
        }
        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

        </div>
        
        <div id="blocoQrCode" class="area-qrcode">

            <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
        </div>
    </div>
