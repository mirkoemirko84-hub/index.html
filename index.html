<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Pix Bradesco</title>
    <!-- Biblioteca para renderizar o QR Code de forma nativa e rápida -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            background-color: #ffffff; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
        }
        #qrcode { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 320px;
        }
        #qrcode img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- 🎯 O QR Code será desenhado exatamente aqui no centro da tela -->
    <div id="qrcode"></div>

    <script>
        // ##########################################################################
        // 🔑 SUA STRING PIX OFICIAL E VALIDADA DIRETO DO SCRIPT DE ETIQUETAS
        // ##########################################################################
        const DADOS_PIX_REAL = "00020126760014BR.GOV.BCB.PIX01363d4ee862-439d-481d-9f5b-07d69a7182f60214Mairiporã Agro5204000053039865802BR5921JOSE CARLOS SUGUIMOTO6009MAIRIPORA62230519JoseCarlosSuguimoto6304C2B6";
        // ##########################################################################

        // Desenha o QR Code perfeito e escaneável na tela do celular ou monitor
        new QRCode(document.getElementById("qrcode"), {
            text: DADOS_PIX_REAL,
            width: 320,
            height: 320,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    </script>

</body>
</html>
