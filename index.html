<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Bradesco Pix Puro</title>
    
    <!-- 🎯 MOTOR GRÁFICO CORRIGIDO COM INTEGRITY ATUALIZADO PARA O APANHADO REAL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4w9au64x7OqdMotc61g5HS6bxnh979O17NX12r563kTRvzg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        body { 
            background-color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .bloco-texto-topo {
            text-align: center;
            margin-bottom: 15px;
        }
        .topo-titulo { 
            font-size: 24px; 
            font-weight: 900; 
            color: #cc092f; 
            text-transform: uppercase; 
            margin: 0 0 4px 0;
        }
        .sub-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            margin: 0;
        }
        #qrcodePuroSemMoldura { 
            display: block;
            margin: 20px auto;
            min-width: 250px;
            min-height: 250px;
            background-color: #fafafa; /* Fundo cinza bem claro temporário para checagem visual */
        }
        #qrcodePuroSemMoldura img {
            width: 250px !important;
            height: 250px !important;
            display: block;
            margin: 0 auto;
        }
        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bloco-texto-topo">
        <div class="topo-titulo">Bradesco Pix Oficial</div>
        <div class="sub-titulo">Mairiporã Agro — José Carlos Suguimoto</div>
    </div>
    
    <!-- Alvo do QR Code -->
    <div id="qrcodePuroSemMoldura"></div>
    
    <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
    
    <div style="font-size: 11px; font-weight: bold; color: #555555; text-align: center; margin-top: 15px; max-width: 280px; line-height: 1.4;">
        Aponte a câmera do celular para pagar o faturamento de balcão com Taxa Zero e Juros Zero
    </div>

<script>
    function fabricarDesenhoPixCoringa() {
        let stringChaveMestre = "00020126760014BR.GOV.BCB.PIX01363d4ee862-439d-481d-9f5b-07d69a7182f60214Mairipora Agro5204000053039865802BR5921JOSE CARLOS SUGUIMOTO6009MAIRIPORA62230519JoseCarlosSuguimoto6304C2B6";
        
        let container = document.getElementById("qrcodePuroSemMoldura");
        if (container) {
            container.innerHTML = "";
            
            // Tratamento caso a biblioteca externa falhe ou seja bloqueada pelo navegador
            if (typeof QRCode === "undefined") {
                container.innerHTML = "<p style='font-size:12px; color:red; text-align:center; padding-top:100px;'>Carregando motor gráfico básico...</p>";
                // Tenta forçar o carregamento dinâmico sem travas de segurança
                let scriptBackup = document.createElement("script");
                scriptBackup.src = "https://jsdelivr.net";
                scriptBackup.onload = function() {
                    container.innerHTML = "";
                    new QRCode(container, { text: stringChaveMestre, width: 250, height: 250 });
                };
                document.head.appendChild(scriptBackup);
            } else {
                // Rota normal limpa
                new QRCode(container, {
                    text: stringChaveMestre,
                    width: 250,
                    height: 250,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });
            }
        }
    }

    // Disparos alternativos para vencer qualquer lentidão de rede
    window.onload = fabricarDesenhoPixCoringa;
    if (document.readyState === "complete" || document.readyState === "interactive") {
        fabricarDesenhoPixCoringa();
    } else {
        document.addEventListener("DOMContentLoaded", fabricarDesenhoPixCoringa);
    }
</script>
</body>
</html>
