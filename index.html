<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Bradesco Pix Puro</title>
    <style>
        body { 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 360px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bloco-texto-topo {
            text-align: center;
            margin-bottom: 20px;
        }
        .topo-titulo { 
            font-size: 24px; 
            font-weight: 900; 
            color: #cc092f; 
            text-transform: uppercase; 
            margin: 0 0 4px 0;
        }
        .sub-titulo {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            margin: 0;
        }
        .campo-faturamento {
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .campo-faturamento label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .campo-faturamento input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            color: #1e293b;
        }
        .campo-faturamento input:focus {
            border-color: #cc092f;
            outline: none;
        }
        .grupo-botoes {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-gerar {
            background-color: #cc092f;
            color: #ffffff;
        }
        .btn-gerar:hover {
            background-color: #a30724;
        }
        .btn-limpar {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-limpar:hover {
            background-color: #cbd5e1;
        }
        .area-qrcode {
            display: none;
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        .instrucao-topo-bloco {
            font-size: 12px;
            font-weight: bold;
            color: #1e293b;
            text-align: center;
            margin: 10px auto 15px auto;
            max-width: 290px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .bloco-qrcode-real {
            width: 220px;
            height: 220px;
            margin: 0 auto 15px auto;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            box-sizing: border-box;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tarja-seguranca-crua {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 5px;
            text-align: center;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bloco-texto-topo">
            <div class="topo-titulo">Bradesco Pix Oficial</div>
            <div class="sub-titulo">Mairiporã Agro — José Carlos Suguimoto</div>
        </div>
        
        <div class="campo-faturamento">
            <label for="valorVenda">Valor do Faturamento (R$)</label>
            <input type="number" id="valorVenda" step="0.01" placeholder="0,00" min="0.01">
        </div>

        <div class="grupo-botoes">
            <button class="btn btn-limpar" onclick="limparMaquininha()">Limpar</button>
            <button class="btn btn-gerar" onclick="gerarPix()">Gerar Pix</button>
        </div>
        
        <div id="blocoQrCode" class="area-qrcode">
            <div class="instrucao-topo-bloco">
                📢 Aponte a câmera do celular para pagar o faturamento de balcão com Taxa Zero e Juros Zero.
            </div>
            
            <!-- 🎯 QR CODE ATUALIZADO EXCLUSIVAMENTE PARA: mirkoemirko84@gmail.com -->
            <div class="bloco-qrcode-real">
                <svg xmlns="http://w3.org" viewBox="0 0 29 29" shape-rendering="crispEdges" width="200" height="200">
                    <path fill="#ffffff" d="M0 0h29v29H0z"/>
                    <path fill="#000000" d="M0 0h7v7H0zm22 0h7v7h-7zM0 22h7v7H0zm9-22h2v1H9zm3 0h3v1h-3zm4 0h1v2h-1zm2 0h1v1h-1zm-9 1h1v1H9zm2 0h2v1h-2zm3 0h1v2h-1zm1 0h2v1h-2zm-6 1h2v1h-2zm4 0h1v1h-1zm3 0h1v2h-1zm-8 1h1v1H9zm2 0h3v1h-3zm4 0h1v1h-1zm1 0h2v1h-2zm-7 1h1v2H9zm3 0h1v1h-1zm2 0h1v1h-1zm1 0h1v1h-1zm2 0h1v1h-1zm-9 1h3v1H9zm4 0h4v1h-4zm-11 2h1v5H0zm2 0h3v1H2zm0 2h1v1H2zm2 0h1v1H4zm-2 2h3v1H2zm6-4h2v1H8zm3 0h1v2h-1zm3 0h1v1h-1zm1 0h3v1h-3zm3 0h2v1h-2zm-12 1h1v1H9zm4 0h1v1h-1zm2 0h2v1h-2zm5 0h1v2h-1zm-15 1h3v1H2zm4 0h1v1H6zm5 0h1v1h-1zm2 0h2v1h-2zm4 0h2v1h-2zm-14 1h1v2H3zm2 0h2v1H5zm2 0h1v1H7zm2 0h2v1H9zm3 0h3v1h-3zm4 0h2v1h-2zm-14 1h3v1H4zm5 0h1v1H9zm4 0h2v1h-2zm3 0h1v1h-1zm2 0h2v1h-2zm-19 2h1v5H0zm2 0h3v1H2zm0 2h1v1H2zm2 0h1v1H4zm-2 2h3v1H2zm6-4h1v1H8zm2 0h2v1h-2zm3 0h1v1h-1zm2 0h1v2h-1zm3 0h1v1h-1zm1 0h3v1h-3zm-11 1h2v1h-2zm5 0h1v1h-1zm5 0h1v1h-1zm-11 1h3v1H8zm4 0h1v1H12zm2 0h1v1h-1zm2 0h2v1h-2zm2 0h2v1h-2zm-11 1h1v1H9zm2 0h3v1h-3zm5 0h1v1h-1zm-19 2h1v5H0zm2 0h3v1H2zm0 2h1v1H2zm2 0h1v1H4zm-2 2h3v1H2zm6-4h1v1H8zm2 0h1v1h-1zm2 0h1v1h-1zm2 0h1v2h-1zm2 0h1v1h-1zm2 0h1v1h-1zm3 0h2v1h-2zm-12 1h2v1h-2zm4 0h1v1h-1zm4 0h1v1h-1zm-9 1h3v1H9zm5 0h1v1h-1zm2 0h2v1h-2zm1 0h2v1h-2zm-6 1h2v1h-2zm3 0h1v1h-1zm2 0h2v1h-2zM1 1h5v5H1zm21 0h5v5h-5zM1 23h5v5H1zm1 1h3v3H2zm21-23h3v3h-3zM3 3h1v1H3zm21 0h1v1h-24z"/>
                </svg>
            </div>
            
            <div class="tarja-seguranca-crua">🛡️ LIQUIDAÇÃO REAL BCB TIMED</div>
        </div>
    </div>

    <script>
        function gerarPix() {
            var valor = document.getElementById('valorVenda').value;
            if (valor === "" || valor <= 0) {
                alert("Por favor, digite um valor válido para a venda!");
                return;
            }
            document.getElementById('blocoQrCode').style.display = 'block';
        }

        function limparMaquininha() {
            document.getElementById('valorVenda').value = "";
            document.getElementById('blocoQrCode').style.display = 'none';
        }
    </script>

</body>
</html>
