    <script>
        function calcularCRC16(str) {
            var crc = 0xFFFF;
            for (var c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            var hex = (crc & 0xFFFF).toString(16).toUpperCase();
            return ("0000" + hex).slice(-4);
        }

        function gerarPix() {
            var campoValor = document.getElementById("valorVenda");
            var valor = parseFloat(campoValor.value);
            
            if (isNaN(valor) || valor <= 0) {
                alert("Por favor, insira um valor válido de faturamento.");
                return;
            }

            var valorFormatado = valor.toFixed(2);
            var chavePix = "mirkoemirko84@gmail.com"; 
            
            var MerchantAccount = "0014br.gov.bcb.pix25" + String(chavePix.length).padStart(2, '0') + chavePix;
            var payloadLivre = "00020126" + MerchantAccount.length + MerchantAccount + "52040000530398654" + String(valorFormatado.length).padStart(2, '0') + valorFormatado + "5802BR5925JOSE CARLOS SUGUIMOTO6009MAIRIPORA62070503***6304";
            
            var payloadCompleto = payloadLivre + calcularCRC16(payloadLivre);

            var qrcodeSpace = document.getElementById("qrcodeSpace");
            qrcodeSpace.innerHTML = ""; 

            // Força a reinicialização limpa do motor nativo na tabela
            var qr = new QRCodeMinimal(7, 'M');
            qr.addData(payloadCompleto);
            qr.make();

            var tabela = document.createElement("table");
            tabela.style.borderCollapse = "collapse";
            tabela.style.border = "none";
            tabela.style.margin = "auto";

            var tamanhoModulo = Math.floor(200 / qr.moduleCount);

            for (var r = 0; r < qr.moduleCount; r++) {
                var linha = document.createElement("tr");
                for (var c = 0; c < qr.moduleCount; c++) {
                    var celula = document.createElement("td");
                    celula.style.width = tamanhoModulo + "px";
                    celula.style.height = tamanhoModulo + "px";
                    // Garante a injeção correta da cor de cada ponto gráfico do Pix
                    celula.style.backgroundColor = qr.modules[r][c] ? "#000000" : "#ffffff";
                    linha.appendChild(celula);
                }
                tabela.appendChild(linha);
            }

            qrcodeSpace.appendChild(tabela);
            document.getElementById("blocoQrCode").style.display = "block";
        }

        function limparMaquininha() {
            document.getElementById("valorVenda").value = "";
            document.getElementById("blocoQrCode").style.display = "none";
            document.getElementById("qrcodeSpace").innerHTML = "";
        }
    </script>
</body>
</html>
