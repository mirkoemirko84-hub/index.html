    <script>
        // Sistema CRC16 oficial exigido pelo regulamento do arranjo Pix
        function calcularCRC16(str) {
            var crc = 0xFFFF;
            for (var c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            var hex = (crc & 0xFFFF).toString(16).toUpperCase();
            return ("0000" + hex).slice(-4);
        }

        function gerarPix() {
            var inputValor = document.getElementById('valorVenda').value;
            if (inputValor === "" || inputValor <= 0) {

                return;
            }

            var chave = "mirkoemirko84@gmail.com";
            var merchantName = "JOSE C SUGUIMOTO";
            var merchantCity = "MAIRIPORA";

            // Montagem da String EMV Estática oficial BR
            var payload = "00020126" + String(chave.length + 22).padStart(2, '0') + "0014br.gov.bcb.pix01" + String(chave.length).padStart(2, '0') + chave;

            var payloadCompleto = payload + calcularCRC16(payload);

            qr.addData(payloadCompleto);
            qr.make();

            // Desenha os blocos pretos e brancos via API gráfica nativa do navegador (Canvas)

            canvas.width = 200;
            canvas.height = 200;
            var ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
