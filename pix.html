    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .indicador-tabular { text-align: center; font-size: 14px; font-weight: bold; color: #cc092f; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .bloco-qrcode-real { display: flex; justify-content: center; align-items: center; background: #fff; padding: 6px; border: 2px dashed #000000; width: 9cm; height: 5cm; box-sizing: border-box; }
        .bloco-qrcode-real table { border-collapse: collapse !important; border-spacing: 0 !important; margin: auto; padding: 0 !important; border: none !important; }
        .bloco-qrcode-real td { padding: 0 !important; margin: 0 !important; border: none !important; width: 3.2px; height: 3.2px; }
        .btn-voltar { margin-top: 25px; padding: 10px 20px; font-size: 11px; font-weight: bold; background-color: #e2e8f0; color: #475569; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    </style>

<body>
    <div class="indicador-tabular">Código de Venda Isolado ⬇️</div>
    <div class="bloco-qrcode-real">
        <div id="qrcodeSpace"></div>
    </div>
    <button class="btn-voltar" onclick="window.location.href='index.html'">Voltar para Maquininha</button>

    <script>
        function calcularCRC16(str) {
            var crc = 0xFFFF;
            for (var c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        window.onload = function() {
            var params = new URLSearchParams(window.location.search);
            var vf = params.get('v');
            var ch = params.get('ch');
            var tx = params.get('tx') || "***";
            if(!vf || !ch) { document.body.innerHTML = "Erro ao carregar os dados do faturamento."; return; }

            var cChave = "01" + String(ch.length).padStart(2, '0') + ch;
            var mAcc = "0014BR.GOV.BCB.PIX" + cChave;
            var bConta = "26" + String((mAcc + "0214Mairiporã Agro").length).padStart(2, '0') + mAcc + "0214Mairiporã Agro";
            var bTxid = "62" + String(("05" + String(tx.length).padStart(2, '0') + tx).length).padStart(2, '0') + "05" + String(tx.length).padStart(2, '0') + tx;
            
            var pLivre = "000201" + bConta + "52040000530398654" + String(vf.length).padStart(2, '0') + vf + "5802BR5921JOSE CARLOS SUGUIMOTO6009MAIRIPORA" + bTxid + "6304";
            var pCompleto = pLivre + calcularCRC16(pLivre);
            
            var qSpace = document.getElementById("qrcodeSpace");
            var qr = new QRCodeMinimal(10, 'M');
            qr.addData(pCompleto);
            qr.make();

            var tabela = document.createElement("table");
            for (var r = 0; r < qr.moduleCount; r++) {
                var l = document.createElement("tr");
                for (var c = 0; c < qr.moduleCount; c++) {
                    var cel = document.createElement("td");
                    cel.style.backgroundColor = qr.modules[r][c] ? "#000000" : "#ffffff";
                    l.appendChild(cel);
                }
                tabela.appendChild(l);
            }
            qSpace.appendChild(tabela);
        };
    </script>
</body>
</html>
