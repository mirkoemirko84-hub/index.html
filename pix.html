<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Pagamento Oficial BCB</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-sizing: border-box; }
        .container-pix { background-color: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; }
        .indicador-tabular { font-size: 14px; font-weight: bold; color: #0d47a1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .txt-valor { font-size: 28px; font-weight: 900; color: #1e293b; margin: 10px 0; }
        .txt-destino { font-size: 12px; color: #64748b; margin-bottom: 15px; font-weight: 600; }
        
        /* 📱 CONTAINER DO QR CODE OFICIAL */
        .bloco-qrcode-real { display: flex; justify-content: center; align-items: center; background: #ffffff; padding: 10px; border: 2px solid #e2e8f0; border-radius: 12px; width: 240px; height: 240px; margin: 20px auto; box-sizing: border-box; }
        .bloco-qrcode-real img { width: 100%; height: 100%; object-fit: contain; }
        
        .btn-voltar { margin-top: 20px; padding: 14px 28px; font-size: 12px; font-weight: bold; background-color: #cc092f; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); letter-spacing: 0.5px; width: 100%; }
        .btn-voltar:hover { background-color: #a00724; }
        .rodape-software { margin-top: 25px; font-size: 10px; color: #94a3b8; font-family: monospace; letter-spacing: 0.5px; text-align: center; }
    </style>
</head>
<body>

    <div class="container-pix">
        <div class="indicador-tabular">Aponte a Câmera do Banco ⬇️</div>
        <div class="txt-valor" id="view-valor">R$ 0,00</div>
        <div class="txt-destino" id="view-destino">Destino: MAIRIPORA AGRO</div>
        
        <!-- O motor vai injetar a imagem oficial e nítida aqui -->
        <div class="bloco-qrcode-real" id="qrcode">Gerando QR Code...</div>

        <button class="btn-voltar" onclick="window.location.href='index.html'">⬅️ Nova Cobrança</button>
        <div class="rodape-software">JCS_software . versao 31.10.26.05</div>
    </div>

    <script>
        window.onload = function() {
            var params = new URLSearchParams(window.location.search);
            var vf = params.get('v');
            var ch = params.get('ch');
            var tx = params.get('tx');

            if(!vf || !ch) { 
                document.getElementById("qrcode").innerHTML = "<b style='color:red;'>Erro nos dados.</b>"; 
                return; 
            }

            var chaveLimpa = ch.trim();
            var valorInalterado = parseFloat(vf).toFixed(2);
            
            document.getElementById("view-valor").innerText = "R$ " + parseFloat(vf).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

            // MONTAGEM DA STRING SEGUINDO O PADRÃO BR CODE DO BANCO CENTRAL
            var bChave = "01" + String(chaveLimpa.length).padStart(2, '0') + chaveLimpa;
            var bGui = "0014br.gov.bcb.pix" + bChave;
            var bConta = "26" + String(bGui.length).padStart(2, '0') + bGui;
            var bValor = "54" + String(valorInalterado.length).padStart(2, '0') + valorInalterado;
            
            var txIdLimpo = tx ? tx.replace(/[^a-zA-Z0-9]/g, '') : "";
            if (txIdLimpo === "" || tx === "***") { txIdLimpo = "***"; }
            var bSub62 = "05" + String(txIdLimpo.length).padStart(2, '0') + txIdLimpo;
            var bTxid = "62" + String(bSub62.length).padStart(2, '0') + bSub62;

            var pLivre = "000201" + bConta + "520400005303986" + bValor + "5802BR5921JOSE CARLOS SUGUIMOTO6009MAIRIPORA" + bTxid + "6304";
            
            // CÁLCULO DO CRC16 DA STRING
            var crc = 0xFFFF;
            for (var c = 0; c < pLivre.length; c++) {
                crc ^= pLivre.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            var pCompleto = pLivre + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
            
            // 🚀 CHUTE DIRETO PRO GOL: API do Google Charts gera a imagem perfeita via HTML puro
            var urlGoogleChart = "https://googleapis.com|1&chl=" + encodeURIComponent(pCompleto);
            document.getElementById("qrcode").innerHTML = '<img src="' + urlGoogleChart + '" alt="QR Code Pix">';
        };
    </script>
</body>
</html>
