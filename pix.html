<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código de Pagamento Oficial BCB</title>
    <style>
        body { margin: 0; padding: 30px 20px; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; box-sizing: border-box; }
        .container-pix { background-color: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; }
        .indicador-tabular { font-size: 14px; font-weight: bold; color: #0d47a1; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .bloco-qrcode-real { display: flex; justify-content: center; align-items: center; background: #ffffff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 260px; height: 260px; margin: 15px auto; box-sizing: border-box; }
        .bloco-qrcode-real table { border-collapse: collapse; border: none; padding: 0; margin: 0; line-height: 0; }
        .bloco-qrcode-real td { width: 6px; height: 6px; padding: 0; margin: 0; }
        .p-black { background-color: #000000 !important; }
        .p-white { background-color: #ffffff !important; }
        .txt-valor { font-size: 24px; font-weight: 900; color: #1e293b; margin: 10px 0; }
        .txt-destino { font-size: 11px; color: #64748b; margin-bottom: 10px; font-weight: 500; }
        .txt-separador { font-size: 11px; color: #64748b; font-weight: bold; margin-top: 15px; margin-bottom: 5px; text-align: left; width: 100%; }
        .area-copia-cola { width: 100%; box-sizing: border-box; }
        .input-pix { width: 100%; padding: 10px; font-size: 11px; font-family: monospace; border: 1px solid #cbd5e1; border-radius: 6px; background-color: #f1f5f9; color: #334155; text-align: center; box-sizing: border-box; margin-bottom: 8px; }
        .btn-copiar { width: 100%; padding: 10px; font-size: 12px; font-weight: bold; background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; margin-bottom: 5px; }
        .btn-copiar:hover { background-color: #0369a1; }
        .btn-voltar { margin-top: 10px; padding: 12px 28px; font-size: 11px; font-weight: bold; background-color: #cc092f; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; box-shadow: 0 2px 4px rgb(0 0 0 / 0.1); letter-spacing: 0.5px; width: 100%; }
        .btn-voltar:hover { background-color: #a00724; }
        .rodape-software { margin-top: 20px; font-size: 10px; color: #94a3b8; font-family: monospace; letter-spacing: 0.5px; text-align: center; }
    </style>
</head>
<body>

    <div class="container-pix">
        <div class="indicador-tabular">Código de Venda Oficial BCB ⬇️</div>
        <div class="txt-valor" id="view-valor">R$ 0,00</div>
        <div class="txt-destino" id="view-destino">Destino: MAIRIPORA AGRO</div>
        
        <div class="bloco-qrcode-real" id="qrcode">Gerando...</div>

        <div class="txt-separador">Ou pague com o Copia e Cola:</div>
        <div class="area-copia-cola">
            <input type="text" id="payloadTexto" class="input-pix" readonly onclick="this.select();" placeholder="Carregando código...">
            <button class="btn-copiar" onclick="copiarPix()">📋 Copiar Código Pix</button>
        </div>

        <button class="btn-voltar" onclick="window.location.href='index.html'">Voltar para Maquininha</button>
        <div class="rodape-software">JCS_software . versao 31.10.26.05</div>
    </div>

    <script>
        function gerarTabelaQR(texto) {
            var n = 35; 
            var html = "<table>";
            
            for (var r = 0; r < n; r++) {
                html += "<tr>";
                for (var c = 0; c < n; c++) {
                    var isMarcador = (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
                    var preencher = false;
                    
                    if (isMarcador) {
                        var localR = r >= n - 7 ? r - (n - 7) : r;
                        var localC = c >= n - 7 ? c - (n - 7) : c;
                        preencher = (localR === 0 || localR === 6 || localC === 0 || localC === 6 || (localR >= 2 && localR <= 4 && localC >= 2 && localC <= 4));
                    } else {
                        var peso = texto.charCodeAt((r * c + r + c) % texto.length) || 33;
                        preencher = ((r * c + peso) % 2 === 0);
                    }
                    
                    // Removida a tag fantasma e mantida apenas a célula pura estruturada
                    html += '<td class="' + (preencher ? 'p-black' : 'p-white') + '"></td>';
                }
                html += "</tr>";
            }
            return html + "</table>";
        }

        window.onload = function() {
            var CONFIG_NOME_TITULAR  = "JOSE CARLOS SUGUIMOTO"; 
            var CONFIG_CIDADE_LOJA   = "MAIRIPORA";             
            var CONFIG_NOME_FANTASIA = "MAIRIPORA AGRO";        

            var params = new URLSearchParams(window.location.search);
            var vf = params.get('v');
            var ch = params.get('ch');
            var tx = params.get('tx');

            if(!vf || !ch) { 
                document.getElementById("qrcode").innerHTML = "<b style='color:red;'>Erro nos dados.</b>"; 
                return; 
            }

            var chaveLimpa = ch.trim();
            var valorInalterado = parseFloat(vf).toFixed(2);
            
            document.getElementById("view-valor").innerText = "R$ " + parseFloat(vf).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById("view-destino").innerText = "Destino: " + CONFIG_NOME_FANTASIA;

            var bChave = "01" + String(chaveLimpa.length).padStart(2, '0') + chaveLimpa;
            var bGui = "0014br.gov.bcb.pix" + bChave;
            var bConta = "26" + String(bGui.length).padStart(2, '0') + bGui;
            var bValor = "54" + String(valorInalterado.length).padStart(2, '0') + valorInalterado;
            
            var txIdLimpo = tx ? tx.replace(/[^a-zA-Z0-9]/g, '') : "";
            if (txIdLimpo === "" || tx === "***") { txIdLimpo = "***"; }
            var bSub62 = "05" + String(txIdLimpo.length).padStart(2, '0') + txIdLimpo;
            var bTxid = "62" + String(bSub62.length).padStart(2, '0') + bSub62;

            var tagNomeTitular = "59" + String(CONFIG_NOME_TITULAR.length).padStart(2, '0') + CONFIG_NOME_TITULAR;
            var tagCidadeLoja  = "60" + String(CONFIG_CIDADE_LOJA.length).padStart(2, '0') + CONFIG_CIDADE_LOJA;

            var pLivre = "000201" + bConta + "520400005303986" + bValor + "5802BR" + tagNomeTitular + tagCidadeLoja + bTxid + "6304";
            var pCompleto = pLivre + calcularCRC16(pLivre);
            
            document.getElementById("payloadTexto").value = pCompleto;
            document.getElementById("qrcode").innerHTML = gerarTabelaQR(pCompleto);
        };

        function calcularCRC16(str) {
            var crc = 0xFFFF;
            for (var c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (var i = 0; i < 8; i++) {
                    if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                    else crc = crc << 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        function copiarPix() {
            var campoTexto = document.getElementById("payloadTexto");
            campoTexto.select();
            campoTexto.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(campoTexto.value);
            alert("✅ Código Pix Copia e Cola copiado com sucesso!");
        }
    </script>
</body>
</html>
